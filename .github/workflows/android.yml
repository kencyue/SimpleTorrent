name: Android CI

on:
  push:
    branches: [main, play-store-compliance-2026]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/*.apk release-files/SimpleTorrent.apk
          cp app/build/outputs/bundle/release/*.aab release-files/SimpleTorrent.aab
          ls -lh release-files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTorrent-release-apk
          path: release-files/SimpleTorrent.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTorrent-release-aab
          path: release-files/SimpleTorrent.aab
          if-no-files-found: error

      - name: Attach APK and AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-files/SimpleTorrent.apk \
            release-files/SimpleTorrent.aab \
            --clobber
