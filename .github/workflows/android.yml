name: Android CI

on:
  push:
    branches: [main, play-store-compliance-2026]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/simpletorrent-release.jks"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/simpletorrent-release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -x "$APKSIGNER"
          test -n "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Collect release files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/*.apk release-files/SimpleTorrent.apk
          cp app/build/outputs/bundle/release/*.aab release-files/SimpleTorrent.aab
          ls -lh release-files

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTorrent-release-apk
          path: release-files/SimpleTorrent.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTorrent-release-aab
          path: release-files/SimpleTorrent.aab
          if-no-files-found: error

      - name: Attach APK and AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-files/SimpleTorrent.apk \
              release-files/SimpleTorrent.aab \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-files/SimpleTorrent.apk \
              release-files/SimpleTorrent.aab \
              --title "SimpleTorrent $GITHUB_REF_NAME" \
              --generate-notes
          fi
